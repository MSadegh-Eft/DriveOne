# Keep this outside Git. The verifier never downloads the full sensor dataset.
data:
  root: data/refav
  records_file: null
  split_manifest: official_argoverse2_log_split
  split_manifest_file: source/official_log_split_manifest.json
  expected_protocol: spatio_temporal_tracks

candidate_protocol:
  decision_timestamps: all_aligned_prompt_timestamps
  positive_label: 0
  positive_name: REFERRED_OBJECT
  hard_negative_labels: [1, 2]
  hard_negative_names: [RELATED_OBJECT, OTHER_OBJECT]
  candidate_pool: all_tracker_tracks_at_timestamp
  candidate_ids: randomized_before_model_input
  candidate_features_allowed: [rendered_candidate_crop, projected_box, raw_tracker_category_if_prepinned]
  candidate_features_excluded: [label, name, score, timestamp_ns, future_timestamp, is_positive, track_id]
  official_filter: max_50m_and_refav_roi
  primary_target: multi_positive_referred_track
  top1_is_secondary_diagnostic: true
  matching_rule: "fixed semantic taxonomy-compatible one-to-one Hungarian assignment at <=2m ego-frame XY distance"
  unmatched_status: UNMATCHED_TRACK
  candidate_construction_order: "candidate pool first; target association second"
  camera_policy: "all seven ring cameras in fixed order; nearest image <=100ms; out-of-view rows retained"
  timestamp_selection: "annotation timestamp union intersected with tracker, pose, and any camera timestamp; no relevance-label checks"
  taxonomy_compatibility: "versioned semantic groups in src/driveone/data/refav_repair.py"
  candidate_pool_hash: "required_before_label_attachment"
  candidate_rows_retain_unknown: true
  hard_negative_score_tolerance: 0.05
  hard_negative_log_area_tolerance: 0.2

split_protocol:
  split_unit: log_id
  train_validation_test: log_disjoint
  query_holdout: normalized_prompt_template_disjoint
  near_duplicate_check: normalized_prompt_and_log_deduplication
  repeated_prompt_plan: "exact prompt overlap across disjoint train/validation/test log triplets; plan is external"

metrics:
  official_when_available: [HOTA-Temporal, HOTA-Track, Timestamp_Balanced_Accuracy, Log_Balanced_Accuracy]
  custom_diagnostics: [per_frame_average_precision, per_track_average_precision, recall_at_k, nll, brier, ece]

verification:
  require_camera_association: true
  require_reproducible_candidate_pool: true
  reject_missing_required_fields: true
  reject_malformed_array_lengths: true
  report_oracle_candidate_coverage: true
  two_seeds_after_smoke_test: true
  require_pinned_provenance: true
  require_official_split_manifest: true
  require_label_independent_candidate_pool: true
  require_candidate_pool_hash: true
  positive_availability_threshold: 0.80
  positive_projection_threshold: 0.90
  matching_sensitivity_max_change: 0.10

pe_smoke:
  config: PE-Core-L14-336
  official_repository_commit: "3e352cca660658d4b5c90f42a7808b11469e4c66"
  report_artifact: "pe_core_l14_336_real_gpu2.json sha256:6864b983422203d506806dcbd652ce8f9f312a6c13ec3cad21c048a1cee0a485"
  device: "cuda_visible_device_2"
  patch_shape: [1, 576, 1024]
  pooled_shape: [1, 1024]
  official_clip_text_path: tested
  official_clip_text_context_length: 32
  text_feature_shape: [1, 1024]
  standalone_tokenizer_context_length: 77

baseline_smoke:
  subset_groups_per_split: 200
  seed: 0
  models: [candidate_only, metadata_only, task_id, pooled_pe]
  pooled_pe_features: frozen_image_and_text
  source_camera: ring_front_center
  source_image_size: [1550, 2048]
  feature_dtype: float32
  scorer_dtype: float32
  task_id_conditioning: "pooled PE image plus learned prompt ID"
  pooled_pe_conditioning: "pooled PE image plus PE text"
  training_loss: "BCE on labeled candidates; unknown candidates retained for ranking evaluation"
  proceed_to_patch_tokens: false
  reason: "Corrected one-seed smoke test does not beat deterministic tracker/geometry controls on the held-out test subset."

baseline_replication:
  subset_groups_per_split: 500
  seed: 0
  proceed_to_patch_tokens: false
  reason: "Corrected larger one-seed replication confirms the pooled-PE result remains below deterministic tracker/geometry controls."

protocol_diagnosis:
  subset_groups_per_split: 500
  visibility_gap_threshold: 0.10
  projected_area_median_ratio_threshold: 1.5
  control_mAP_margin: 0.03
  minimum_rankable_groups: 50
  oracle_excluded_from_shortcut_decision: true
  decision: PROTOCOL_REPAIR_REQUIRED
  proceed_to_patch_tokens: false

protocol_repair:
  repair_version: refav-le3de2e-repair-v1
  official_tracker_file: Le3DE2E_tracking_predictions_val.pkl
  official_tracker_revision: "d983c7955b1c6a126542bea0a4dfb3a2c7327e6a"
  pilot_logs: "same nine logs as refav_repeated_prompt_log_plan.json when present in official validation source"
  matching_thresholds_m: [1.0, 2.0, 4.0]
  primary_threshold_m: 2.0
  camera_tolerance_ms: 100
  tracker_tolerance_ms: 250
  camera_names: [ring_front_center, ring_front_left, ring_front_right, ring_rear_left, ring_rear_right, ring_side_left, ring_side_right]
  best_camera_selection: false
  proceed_to_model_training: false

candidate_source_audit:
  audit_version: refav-candidate-sources-v1
  official_refav_commit: "5c5be6439ce59b61a31d56431a79a8a04bba33fa"
  selected_logs: "same nine logs as refav_repeated_prompt_log_plan.json"
  timestamp_grid: "exact native Le3DE2E timestamps intersected with annotation, pose, and camera assets"
  sources: [official_replay, le3de2e_causal, valeo_historical, gt_oracle]
  external_object_track_only: true
  ego_vehicle_prompts: "reported separately as scenario-level; excluded from external-box coverage"
  official_replay_score_filter: "whole-log filter replayed for comparison; not causal online generation"
  unmatched_status: UNMATCHED_TRACK
  unmatched_ranking_policy: "explicit non-referred tracker false positive for ranking diagnostics; never relabeled OTHER_OBJECT"
  ambiguity_policy: "report conservative unique assignment and optimistic including-ambiguity bounds"
  camera_frames: "nearest selected frame per native timestamp, all seven ring cameras, tolerance <=100ms"
  camera_download_manifest: "/ehsan/m.sadegh/driveone_assets/refav/camera_download_manifest_20261008.json"
  report: "/ehsan/m.sadegh/driveone_assets/refav/candidate_source_audit_20261008_v3/candidate_source_audit.json"
  report_sha256: "0ad1d654d85c0e66cd82311cbcab7ebc75256db31e1e64d79b76e9273ecd69e0"
  expected_external_positive_availability: 0.80
  expected_positive_projection: 0.90
  expected_matching_sensitivity_max_change: 0.10
  decision: REFAV_ORACLE_ONLY
  proceed_to_model_training: false
