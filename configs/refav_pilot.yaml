  repeated_prompt_audit_artifact: "refav_tracker_repeated_prompt9_audit.json sha256:f8011df7017b75372c2b0cbf08a9763f7e7f46c68dedbe63a70cfcde19aad851"
  repeated_prompt_control_artifact: "refav_controls_repeated_prompt9.json sha256:3d865f67f1b9ecb56c35376f3e975f39ce371dfabc762ce99cd6d8eb518aff5c"
  repeated_prompt_split_control_artifact: "refav_controls_repeated_prompt9_splits.json sha256:780816682c52483ce8f262d7e3bab088c133619b36b2ae15ada6ff5263c86844"
  split_manifest_sha256: "94150fb8c2a8d0dafc914e78f9f06f9b7e5887a3b5beb173bc7aa42d1092dc47"
  license: "RefAV repository MIT; Argoverse 2 data terms apply separately"

# Keep this outside Git. The verifier never downloads the full sensor dataset.
data:
  root: data/refav
  records_file: null
  split_manifest: official_argoverse2_log_split
  split_manifest_file: source/official_log_split_manifest.json
  expected_protocol: spatio_temporal_tracks

candidate_protocol:
  decision_timestamps: all_aligned_prompt_timestamps
  positive_label: 0
  positive_name: REFERRED_OBJECT
  hard_negative_labels: [1, 2]
  hard_negative_names: [RELATED_OBJECT, OTHER_OBJECT]
  candidate_pool: all_tracker_tracks_at_timestamp
  candidate_ids: randomized_before_model_input
  candidate_features_allowed: [rendered_candidate_crop, projected_box, raw_tracker_category_if_prepinned]
  candidate_features_excluded: [label, name, score, timestamp_ns, future_timestamp, is_positive, track_id]
  official_filter: max_50m_and_refav_roi
  primary_target: multi_positive_referred_track
  top1_is_secondary_diagnostic: true
  matching_rule: "same-category one-to-one Hungarian assignment at <=2m ego-frame XY distance"
  unmatched_status: UNMATCHED_TRACK
  camera_policy: "shared ring_front_center frame per group; nearest image <=100ms"
  timestamp_selection: "annotation prompt timestamps intersected with tracker, pose, and shared-camera timestamps; no relevance-label checks"
  hard_negative_score_tolerance: 0.05
  hard_negative_log_area_tolerance: 0.2

split_protocol:
  split_unit: log_id
  train_validation_test: log_disjoint
  query_holdout: normalized_prompt_template_disjoint
  near_duplicate_check: normalized_prompt_and_log_deduplication
  repeated_prompt_plan: "exact prompt overlap across disjoint train/validation/test log triplets; plan is external"

metrics:
  official_when_available: [HOTA-Temporal, HOTA-Track, Timestamp_Balanced_Accuracy, Log_Balanced_Accuracy]
  custom_diagnostics: [per_frame_average_precision, per_track_average_precision, recall_at_k, nll, brier, ece]

verification:
  require_camera_association: true
  require_reproducible_candidate_pool: true
  reject_missing_required_fields: true
  reject_malformed_array_lengths: true
  report_oracle_candidate_coverage: true
  two_seeds_after_smoke_test: true
  require_pinned_provenance: true
  require_official_split_manifest: true

pe_smoke:
  config: PE-Core-L14-336
  official_repository_commit: "3e352cca660658d4b5c90f42a7808b11469e4c66"
  report_artifact: "pe_core_l14_336_clip_gpu2.json sha256:362fa0ccb0c9d6bf30f75d5dc58eb872561b0e9803cc11fca5cfed6c2fc58472"
  device: "cuda_visible_device_2"
  patch_shape: [1, 576, 1024]
  pooled_shape: [1, 1024]
  official_clip_text_path: tested
  official_clip_text_context_length: 32
  text_feature_shape: [1, 1024]
  standalone_tokenizer_context_length: 77
