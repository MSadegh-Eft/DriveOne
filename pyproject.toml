[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driveone"
version = "0.1.0"
description = "DriveOne RefAV feasibility and candidate-ranking research code"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
pe = ["torch", "pillow"]

[tool.setuptools.packages.find]
where = ["src"]
